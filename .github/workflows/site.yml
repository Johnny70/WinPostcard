name: Site

# Publishes the landing page. This is the only job that writes to the pages
# branch, so each run replaces its content outright -- nothing else to keep_files for.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: sh web/build.sh site

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: pages
          cname: johnnyjakobsson.com
